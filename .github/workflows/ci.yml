# Esqueleto del pipeline. Hoy no verifica nada: eso es lo que ustedes van a resolver.
#
# Reto 1 — que corra solo en cada push a main y en cada Pull Request, instale las
#          dependencias de requirements-dev.txt y ejecute pytest.
# Reto 2 — agregar un job de lint con ruff que corra ANTES de las pruebas.
# Reto 3 — correr las pruebas en Python 3.12 y 3.13, con cobertura mínima de 80%.
# Reto 4 — agregar el job del quality gate del modelo.
#
# Documentación: https://docs.github.com/actions

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint y formato
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install ruff==0.15.11

      - run: ruff check .

      - run: ruff format --check .

  pruebas:
    name: Pruebas
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
        
          python-version: "3.12"
          cache: pip
          cache-dependence-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - run: pytest -v
