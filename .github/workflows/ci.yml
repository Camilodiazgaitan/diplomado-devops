# Esqueleto del pipeline. Hoy no verifica nada: eso es lo que ustedes van a resolver.
#
# Reto 1 — que corra solo en cada push a main y en cada Pull Request, instale las
#          dependencias de requirements-dev.txt y ejecute pytest.
# Reto 2 — agregar un job de lint con ruff que corra ANTES de las pruebas.
# Reto 3 — correr las pruebas en Python 3.12 y 3.13, con cobertura mínima de 80%.
# Reto 4 — agregar el job del quality gate del modelo.
#
# Documentación: https://docs.github.com/actions

name: CI
on:                        # disparadores
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    name: lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
         python-version: "3.12"
      - run: pip install ruff==0.15.11
      - name: Reglas de estilo y errores comunes
        run : ruff check .
      - name: Formato del codigo
        run: ruff format --check .
  pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
         python-version: ${{ matrix.python-version }}
         cache: pip                               # reutiliza lo descargado en ejecuciones anteriores
         cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas con cobertura (mínimo 80%)
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Guardar el reporte de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage.xml
      - name: Por ahora no verifica nada
        run: echo "El pipeline corre, pero todavia no verifica nada. Resuelvan el reto 1."
