# ============================================================================
# PIPELINE DE CD · Sesión 2
# Qué hace este archivo, en palabras simples:
# 1. Espera a que el pipeline de CI (el de ayer) termine en verde.
# 2. Empaqueta la aplicación en una "imagen" (una caja con todo lo que
# necesita para correr) y la guarda en el registro de GitHub.
# 3. Prende esa caja en un ambiente de ensayo (puesta en escena) y le hace una
# prueba rápida.
# 4. Si alguien del equipo aprueba, la marca como la versión de producción.
# ============================================================================

nombre: CD

# ---------------------------------------------------------------------------
# CUÁNDO ARRANCA: cuando termina el flujo de trabajo de CI sobre la rama principal.
# ---------------------------------------------------------------------------
en:
  ejecución_del_flujo de trabajo:
    flujos de trabajo: [CI] # el nombre de su flujo de trabajo de CI (línea "name:" de ci.yml)
    tipos: [completado] # "cuando termine"
    sucursales: [principal] # solo cambios en principal
  flujo de trabajo_dispatch: # agrega el botón "Ejecutar flujo de trabajo" para lanzarlo a mano

# ---------------------------------------------------------------------------
# PERMISOS: qué puede hacer el pipeline en su repositorio.
# ---------------------------------------------------------------------------
permisos:
  contenidos: leer # leer el código
  paquetes: escriba # ¿el pipeline necesita LEER o ESCRIBIR paquetes? (leer/escribir)

# Nunca dos despliegues al mismo tiempo: si llega otro, espera su turno.
concurrencia:
  grupo: cd-${{ github.repository }}
  cancelación en curso: falso

empleos:
  # =========================================================================
  # RETO 6 · Construir la imagen y guardarla en el registro de GitHub
  # =========================================================================
  construir:
    nombre: Construir y publicar la imagen
    # Solo sigue si CI terminó en verde (o si lo lanzaron a mano con el botón).
    Si: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    salidas: # datos que este trabajo le pasa a los siguientes
      imagen: ${{ pasos.nombre.outputs.imagen }}
      versión: ${{ steps.nombre.outputs.version }}
    pasos:
      - nombre: Descargar el código que pasó CI
        usos: actions/checkout@v7
        con:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - nombre: Decidir el nombre y la versión de la imagen
        id: nombre
        entorno:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        correr: |
          # Nombre: ghcr.io/usuario/repositorio (en minúsculas, el registro lo exige)
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Versión: los 7 primeros caracteres del commit, por ejemplo 3f9a1c2
          echo "version=${SHA::7}" >> "$GITHUB_OUTPUT"

      - nombre: Iniciar sesión en el registro de GitHub
        entorno:
          TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub lo crea solo en cada ejecución
        ejecutar: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - nombre: Construir la imagen (usa el Dockerfile del repositorio)
        ejecutar: >
          compilación de Docker
          -t "${{ steps.nombre.outputs.imagen }}:${{ steps.nombre.outputs.version }}"
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          .

      - nombre: Publicar la imagen en el registro
        ejecutar: docker push "${{ steps.nombre.outputs.imagen }}:${{ steps.nombre.outputs.ver
